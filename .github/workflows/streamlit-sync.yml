name: Build frontend for Streamlit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'streamlit_frontend/**'
      - 'streamlit_release.py'
      - '**/*.md'
permissions:
  contents: write
concurrency:
  group: streamlit-frontend-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:streamlit
      - name: Commit compiled frontend
        shell: bash
        run: |
          git add streamlit_frontend streamlit_release.py
          if git diff --cached --quiet; then
            echo "Frontend unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: update Streamlit frontend [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
